name: Build Mac app
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  build:
    # macos-latest = arm64: criza de capacitate (job neacceptat de runner, anulat la 15 min).
    # Intel are coada libera; electron-builder face dmg universal si de pe x64.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: KimonoBrain-dmg
          path: dist/*.dmg
